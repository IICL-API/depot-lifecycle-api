components:
  schemas:
    BaseParty:
      type: object
      properties:
        userCode:
          maxLength: 16
          minLength: 1
          type: string
          description: the user identifier at this company that concerns this message
          nullable: true
          example: JDOE
        userName:
          maxLength: 70
          minLength: 1
          type: string
          description: the full name for the user identified by `userCode`
          nullable: true
          example: John Doe
        faxNumber:
          type: array
          description: the contact fax number(s) for this party
          nullable: false
          items:
            type: string
        phoneNumber:
          type: array
          description: the contact phone number(s) for this party
          nullable: false
          items:
            type: string
        emailAddress:
          type: array
          description: the contact email address(es) for this party
          nullable: false
          items:
            type: string
        name:
          maxLength: 150
          minLength: 1
          type: string
          description: the name of this company
          nullable: true
          example: CMR Container Maintenance Rep.
        streetAddress:
          type: array
          description: the street address lines
          nullable: false
          items:
            type: string
        city:
          maxLength: 28
          minLength: 1
          type: string
          description: the city for the address
          nullable: true
        country:
          maxLength: 2
          minLength: 1
          type: string
          description: the 2 digit ISO country code for the address
          nullable: true
        postalCode:
          maxLength: 20
          minLength: 1
          type: string
          description: the postal code for the address
          nullable: true
        stateProvince:
          maxLength: 20
          minLength: 1
          type: string
          description: the optional state or province code for the address
          nullable: true
        licensePlate:
          maxLength: 14
          minLength: 1
          type: string
          description: the license plate for the person represented by this party
          nullable: true
        latitude:
          type: number
          description: "Instead of an address, provides the latitude of this party"
          format: double
          nullable: true
        longitude:
          type: number
          description: "Instead of an address, provides the longitude of this party"
          format: double
          nullable: true
    BrakeCondition:
      type: string
      description: |-
        the status of the breaks on a Chassis.

        `GOOD` - Good

        `WARN` - Warn

        `BAD` - Bad
      example: GOOD
      enum:
      - GOOD
      - WARN
      - BAD
    ChassisInfo:
      required:
      - licensePlate
      type: object
      properties:
        licensePlate:
          maxLength: 14
          minLength: 1
          type: string
          description: the license plate for the person represented by this party
          nullable: false
        treadMeasurements:
          type: array
          description: An optional list of tread depth measurements for this Chassis
            tires
          nullable: false
          items:
            $ref: "#/components/schemas/TireTreadMeasurement"
        brakeCondition:
          description: |-
            the condition of the breaks on this Chassis.

            `GOOD` - Good

            `WARN` - Warn

            `BAD` - Bad
          nullable: true
          example: GOOD
          allOf:
          - $ref: "#/components/schemas/BrakeCondition"
        hubometer:
          minimum: 0
          type: integer
          description: the current reading of the hubometer on the Chassis
          format: int32
          nullable: true
          example: 15000
      description: Provides Chassis specific information for a given shipping container
    EquipmentDetail:
      required:
      - equipment
      - manufactureDate
      type: object
      properties:
        equipment:
          maxLength: 10
          minLength: 1
          type: string
          description: the equipment type ISO code or an internal code if one does
            not exist for this shipping container
          nullable: false
          example: 22G1
        manufactureDate:
          type: string
          description: |-
            date and month this unit was manufactured

            ( full-date notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date
          nullable: false
          example: 2001-07-21
        loaded:
          type: boolean
          description: indicates if this container has cargo in it
          nullable: true
        cargoSeals:
          type: array
          description: the cargo seal identifiers
          nullable: false
          items:
            type: string
            example: An example Seal ID
        desiredTemperature:
          type: integer
          description: the reefer setpoint / desired temperature in Celsius
          format: int32
          nullable: true
          example: -23
        desiredHumidity:
          type: integer
          description: the reefer desired humidity percentage
          format: int32
          nullable: true
          example: 65
        inspections:
          type: array
          description: inspections related to this shipping container
          nullable: false
          items:
            $ref: "#/components/schemas/InspectionReport"
        machineryInfo:
          description: "if this detail is for a reefer shipping container, then this\
            \ details the cooling machinery information"
          nullable: true
          allOf:
          - $ref: "#/components/schemas/MachineryInfo"
        chassisInfo:
          description: "if this detail is for a Chassis, then this details specific\
            \ Chassis information"
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ChassisInfo"
        gensetInfo:
          description: "if this detail is for a Genset, then this details specific\
            \ Genset information"
          nullable: true
          allOf:
          - $ref: "#/components/schemas/GensetInfo"
      description: provides various equipment information related to a shipping container
    ErrorResponse:
      type: object
      properties:
        code:
          maxLength: 6
          pattern: "^[A-Z0-9]{3}[0-9]{3}$"
          type: string
          description: indicator code specific to this error
          nullable: true
          example: TRI521
        message:
          type: string
          description: a descriptive error message
          nullable: true
          example: Info TRI521 - Unit has been gated-in but is not off-hired
        details:
          type: array
          description: details for the descriptive error message
          nullable: false
          items:
            type: string
            example: "Customer may turn in unit, but will continued to be billed."
      description: |-
        a general response object used when an error occurs to describe why it occurred

        `400` http status codes are used when a request is invalid or the basic requirements are not met

        `405` http status codes are used for business validations
    Estimate:
      required:
      - condition
      - currency
      - depot
      - estimateNumber
      - estimateTime
      - exchangeRate
      - total
      - unitNumber
      type: object
      properties:
        estimateNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: The identifier for this estimate
          nullable: false
          example: DEHAMCE1856373
        unitNumber:
          maxLength: 11
          minLength: 10
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          description: The current unit number of the shipping container.
          nullable: false
          example: CONU1234561
        condition:
          description: |-
            an indicator on the status of the estimate and where it is in the revision process

            `D` - Damaged, Initial Estimate

            `E` - Customer Surveyed, No Approval

            `F` - Customer Approved Estimate, No Survey

            `G` - Customer Approved Estimate, Surveyed

            `L` - Owner Surveyed, No Approval
          allOf:
          - $ref: "#/components/schemas/EstimateCondition"
        estimateTime:
          type: string
          description: "the date and time of the estimate revision activity in local\
            \ time; i.e. `2020-07-21T17:32:28Z` \n\n( notation as defined by [RFC\
            \ 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6)\
            \ )"
          format: date-time
          nullable: false
        comments:
          maxLength: 500
          minLength: 1
          type: string
          description: the comments concerning this estimate
          nullable: true
        requester:
          description: the party submitting this estimate
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Party"
        depot:
          description: the location of this estimate
          allOf:
          - $ref: "#/components/schemas/Party"
        owner:
          description: the shipping container's owner
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Party"
        customer:
          description: the lessee of the shipping container to whom customer line
            items should apply.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Party"
        currency:
          maxLength: 3
          minLength: 3
          pattern: "^[A-Z]{3}$"
          type: string
          description: the currency of amounts entered on this estimate
          nullable: false
          example: EUR
        total:
          type: number
          description: the sum of billed line items for this estimate
          format: double
          nullable: false
          example: 544.95
        exchangeRate:
          type: number
          description: the exchange rate to convert billed currency to the local currency
            of this estimate
          format: double
          nullable: false
          readOnly: true
          example: 0.8133
        customerApproval:
          description: lessee approval information for this estimate
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EstimateCustomerApproval"
        type:
          description: |-
            delineates the type of estimate; whether it was the initial, primary estimate or an ancillary / secondary repair after the initial decision

            `R` - Primary (Unknown Estimation Standard)

            `RI` - Primary (IICL)

            `RC` - Primary (CWCA)

            `RW` - Primary (UCIRC)

            `SC` - Secondary (CWCA)

            `SW` - Secondary (UCIRC)

            `SU` - Secondary Upgrade

            `AS` - Sell Upgrade

            `AU` - Ancillary Upgrade

            `AR` - Ancillary Repair
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EstimateType"
          default: R
        upgradeType:
          description: |-
            the type of secondary upgrade this estimate represents.

            `FG` - Food grade

            `ML` - Malt

            `DB` - Dairy Board

            `EV` - Evian

            `WH` - Whiskey

            `SU` - Sugar

            `CF` - Coffee

            `TB` - Tobacco

            `MC` - Milk cartons

            `MP` - Milk powder

            `AM` - Ammunition

            `CH` - Cotton/Hay

            `TE` - Tea

            `FT` - Flexitank
          nullable: true
          example: AM
          allOf:
          - $ref: "#/components/schemas/UpgradeType"
        revision:
          type: integer
          description: the revision number of the estimate
          format: int32
          nullable: true
          example: 0
        lineItems:
          type: array
          description: detailed damage descriptions that when combined represent the
            damages being repaired by this estimate
          nullable: true
          items:
            $ref: "#/components/schemas/EstimateLineItem"
        taxRates:
          type: array
          description: optional estimate tax rates to share tax rate data between
            systems
          nullable: true
          items:
            $ref: "#/components/schemas/EstimateTaxRate"
        photos:
          type: array
          description: an optional photo list for the shipping container damages.
          nullable: false
          items:
            $ref: "#/components/schemas/EstimatePhoto"
        allocation:
          description: "the amount break downs by party for all line items on this\
            \ estimate; when using multiple types, this represents a combined allocation\
            \ with totals for all estimate types; only transmitted once an estimate\
            \ has been created and allocated"
          nullable: true
          readOnly: true
          allOf:
          - $ref: "#/components/schemas/EstimateAllocation"
        allocationsByType:
          type: array
          description: |-
            *Field is currently proposed to be added - not currently production approved.*

            when multiple types are sent in a single transmission, this represents a breakdown by specific type (estimate type and upgrade type combinations) - this should only be populated when multiple Estimates are sent in a single transmission
          nullable: false
          readOnly: true
          items:
            $ref: "#/components/schemas/EstimateAllocation"
      description: Represents an estimation of costs to repair or upgrade a shipping
        container.
    EstimateAllocation:
      required:
      - ctl
      - customerTotal
      - depot
      - estimateNumber
      - insuranceTotal
      - ownerTotal
      - revision
      - total
      type: object
      properties:
        relatedId:
          type: integer
          description: |-
            *Field is currently proposed to be added - not currently production approved.*

            An internal system identifier to be used to upload Estimate Photos or compare related activities.
          format: int64
          nullable: true
          example: 10102561
        estimateNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: The estimate number this allocation applies to
          nullable: false
          example: DEHAMCE1856373
        revision:
          type: integer
          description: the revision number of the estimate this allocation applies
            to
          format: int32
          nullable: false
          example: 0
        depot:
          description: the location of the estimate
          allOf:
          - $ref: "#/components/schemas/Party"
        total:
          minimum: 0.0
          type: number
          description: the total for the estimate
          format: double
          nullable: false
          example: 544.95
        ownerTotal:
          minimum: 0.0
          type: number
          description: the total of the owner portion for the estimate
          format: double
          nullable: false
          example: 0.00
        customerTotal:
          minimum: 0.0
          type: number
          description: the total of the customer portion for the estimate
          format: double
          nullable: false
          example: 422.96
        insuranceTotal:
          minimum: 0.0
          type: number
          description: the total of the insurance portion for the estimate
          format: double
          nullable: false
          example: 121.99
        depreciatedValue:
          minimum: 0.0
          type: number
          description: the depreciated value of the container
          format: double
          nullable: true
          example: 1151.84
        ctl:
          type: boolean
          description: indicates if the estimate causes the unit to be a constructive
            total lost
          nullable: false
          example: false
        comments:
          maxLength: 500
          minLength: 1
          type: string
          description: comments pertaining to the estimate creation
          nullable: true
          example: "Base Currency is: EUR; Based on estimate, user damages total:\
            \ 0.00; Calculated DV (base): 1151.84; Coverage amount: 121.99; Damage\
            \ exceeds DPP Coverage.; Damages exceed coverage amount. User pays excess.;\
            \ Total paid by DPP Coverage: 121.99; Total owed by user: 422.96;"
        preliminaryDecision:
          type: object
          description: "when possible, this is set to an expected sell/fix decision\
            \ to indicate the likely estimate owner approval action"
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PreliminaryDecision"
          - type: object
        insuranceCoverage:
          description: The applicable insurance coverage for damage estimate purposes
          nullable: true
          allOf:
          - $ref: "#/components/schemas/InsuranceCoverage"
        allocationType:
          description: |-
            *Field is currently proposed to be added - not currently production approved.*

            the estimate (estimate type and upgrade type combination) that this total allocated amounts represent; when not defined, this allocation to applies to all line items on the estimate
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EstimateAllocationType"
        allocationsByType:
          type: array
          description: |-
            *Field is currently proposed to be added - not currently production approved.*

            when multiple estimates are sent in a single transmission, this represents a breakdown of this combined allocation by specific type (estimate type and upgrade type combinations); each entry identifies its estimate via `allocationType` and carries the additive totals for that type; this list is only populated on the combined (top level) allocation
          nullable: false
          items:
            $ref: "#/components/schemas/EstimateAllocation"
      description: "Indicates the allocated estimate totals, including any comments\
        \ on the allocation and if the box is considered a constructive loss."
      readOnly: true
    EstimateAllocationType:
      required:
      - type
      type: object
      properties:
        type:
          description: |-
            delineates the type of estimate; whether it was the initial, primary estimate or an ancillary / secondary repair after the initial decision

            `R` - Primary (Unknown Estimation Standard)

            `RI` - Primary (IICL)

            `RC` - Primary (CWCA)

            `RW` - Primary (UCIRC)

            `SC` - Secondary (CWCA)

            `SW` - Secondary (UCIRC)

            `SU` - Secondary Upgrade

            `AS` - Sell Upgrade

            `AU` - Ancillary Upgrade

            `AR` - Ancillary Repair
          allOf:
          - $ref: "#/components/schemas/EstimateType"
          default: R
        upgradeType:
          description: |-
            the type of secondary upgrade this estimate transmission represents.

            `FG` - Food grade

            `ML` - Malt

            `DB` - Dairy Board

            `EV` - Evian

            `WH` - Whiskey

            `SU` - Sugar

            `CF` - Coffee

            `TB` - Tobacco

            `MC` - Milk cartons

            `MP` - Milk powder

            `AM` - Ammunition

            `CH` - Cotton/Hay

            `TE` - Tea

            `FT` - Flexitank
          nullable: true
          example: AM
          allOf:
          - $ref: "#/components/schemas/UpgradeType"
      description: Represents a specific estimate transmission defined by a combination
        of estimate type and optional upgrade type
    EstimateCondition:
      type: string
      description: |-
        an indicator on the status of the estimate and where it is in the revision process

        `D` - Damaged, Initial Estimate

        `E` - Customer Surveyed, No Approval

        `F` - Customer Approved Estimate, No Survey

        `G` - Customer Approved Estimate, Surveyed

        `L` - Owner Surveyed, No Approval
      enum:
      - D
      - E
      - F
      - G
      - L
    EstimateCustomerApproval:
      required:
      - approvalDateTime
      - approvalTotal
      type: object
      properties:
        approvalNumber:
          maxLength: 128
          minLength: 1
          type: string
          description: The approval number from the customer
          nullable: true
          example: RAMON ROUBAL
        approvalDateTime:
          type: string
          description: "The time the estimate was approved by the customer; i.e. `2017-04-10T19:37:04Z`\
            \ \n\n( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6)\
            \ )"
          format: date-time
          nullable: false
        approvalUser:
          maxLength: 64
          minLength: 1
          type: string
          description: the user name or code who approved this estimate on behalf
            of the customer
          nullable: true
          example: KAERTS
        approvalTotal:
          minimum: 0.00
          type: number
          description: the amount in the currency of the estimate that's approved
            by the customer
          format: double
          nullable: false
          example: 422.96
      description: Represents the approval of the customer amount portion.
    EstimateLineItem:
      required:
      - component
      - damage
      - hours
      - laborRate
      - line
      - material
      - materialCost
      - party
      - repair
      type: object
      properties:
        line:
          type: integer
          description: The line number
          format: int32
          nullable: false
          example: 1
        location:
          maxLength: 4
          minLength: 4
          pattern: "^[A-Z0-9]{4}$"
          type: string
          description: |-
            specifies the damage location code on a container

            [see IICL Preferred Location Codes, Section 5.7](https://www.iicl.org/iiclforms/assets/File/public/bulletins/TB002_EDIS_February_2003.pdf)
          nullable: true
          example: UR1N
        component:
          maxLength: 3
          minLength: 3
          pattern: "^[A-Z0-9]{3}$"
          type: string
          description: |-
            component code

            [see IICL Preferred Component Codes, Section 5.1](https://www.iicl.org/iiclforms/assets/File/public/bulletins/TB002_EDIS_February_2003.pdf)
          nullable: false
          example: CMA
        damage:
          maxLength: 2
          minLength: 2
          pattern: "^[A-Z0-9]{2}$"
          type: string
          description: |-
            damage code

            [see IICL Preferred Damage Codes, Section 5.2](https://www.iicl.org/iiclforms/assets/File/public/bulletins/TB002_EDIS_February_2003.pdf)
          nullable: false
          example: CK
        repair:
          maxLength: 2
          minLength: 2
          pattern: "^[A-Z0-9]{2}$"
          type: string
          description: |-
            repair code

            [see IICL Preferred Repair Codes, Section 5.4](https://www.iicl.org/iiclforms/assets/File/public/bulletins/TB002_EDIS_February_2003.pdf)
          nullable: false
          example: IT
        material:
          maxLength: 2
          minLength: 2
          pattern: "^[A-Z0-9]{2}$"
          type: string
          description: |-
            component material code

            [see IICL Preferred Material Type Codes, Section 5.5](https://www.iicl.org/iiclforms/assets/File/public/bulletins/TB002_EDIS_February_2003.pdf)
          nullable: false
          example: MU
        length:
          minimum: 0
          type: integer
          description: the length dimension of the damage
          format: int32
          nullable: true
          example: 15
        width:
          minimum: 0
          type: integer
          description: the width dimension of the damage
          format: int32
          nullable: true
          example: 1
        height:
          minimum: 0
          type: integer
          description: the height dimension of the damage
          format: int32
          nullable: true
          example: 1
        unitOfMeasure:
          description: |+
            the measurement of the damage dimensions for this line item

            `CMT` - "Centimeters"

             `FOT` - "Feet"

             `GRM` - "Grams"

             `INH` - "Inches"

             `KGM` - "Kilograms"

             `MTR` - "Meters"

             `TON` - "Tons"

             `MTT` - "Metric Tons"

             `MMT` - "Millimeters"

          nullable: true
          allOf:
          - $ref: "#/components/schemas/UnitOfMeasure"
        hours:
          minimum: 0.00
          type: number
          description: the number of hours to repair this damage
          format: double
          nullable: false
          example: 9.95
        materialCost:
          minimum: 0.00
          type: number
          description: the cost of materials to repair this damage
          format: double
          nullable: false
          example: 9.95
        laborRate:
          minimum: 0.00
          type: number
          description: rate to pay the labor to repair this damage
          format: double
          nullable: false
          example: 35.00
        tax:
          type: number
          description: the tax amount for this line item
          format: double
          nullable: true
          example: 0.00
        party:
          description: |+
            The party that is responsible for the cost of this repair

             `O` - Owner

             `U` - Customer

             `I` - Insurance

             `W` - Warranty

             `S` - Special

             `D` - Depot

             `X` - Deleted

             `T` - Third Party

          allOf:
          - $ref: "#/components/schemas/EstimateLineItemParty"
        comments:
          maxLength: 256
          minLength: 1
          type: string
          description: comments concerning this line item repair
          nullable: true
        taxRule:
          description: |-
            which amount should taxes apply

            `B` - Both Labor Cost & Material Cost

            `N` - Neither

            `L` - Labor Cost

            `M` - Material Cost
          nullable: true
          example: B
          allOf:
          - $ref: "#/components/schemas/EstimateTaxRule"
        quantity:
          minimum: 1
          type: integer
          description: the number of damages
          format: int32
          nullable: true
          example: 1
        parts:
          type: array
          description: "An optional, detailed part list used to repair this line item"
          nullable: false
          items:
            $ref: "#/components/schemas/EstimateLineItemPart"
        photos:
          type: array
          description: An optional photo list showing the damage of this line item
          nullable: false
          items:
            $ref: "#/components/schemas/EstimateLineItemPhoto"
        allocationTypes:
          type: array
          description: |-
            *Field is currently proposed to be added - not currently production approved.*

            the transmission (estimate type and upgrade type combination) this line item belongs to. When specified, this line item is part of a specific transmission. When empty or null, the line item uses the estimate's type and upgradeType fields.
          nullable: false
          items:
            $ref: "#/components/schemas/EstimateAllocationType"
      description: Represents an estimation of costs to repair or upgrade a single
        instance of damage for a shipping container.
    EstimateLineItemPart:
      required:
      - number
      - price
      - quantity
      type: object
      properties:
        description:
          maxLength: 500
          minLength: 1
          type: string
          description: a description for this part
          nullable: true
          example: Paint A
        number:
          maxLength: 50
          minLength: 1
          type: string
          description: ID number used to signify what part is being used
          nullable: false
          example: "108106"
        quantity:
          minimum: 1
          type: integer
          description: the number of parts used
          format: int32
          nullable: false
          example: 1
        price:
          type: number
          description: the price per part
          format: double
          nullable: false
          example: 2.88
      description: Represents a part used for the repair of a line item.
    EstimateLineItemParty:
      type: string
      description: |+
        The party that is responsible for the cost of this repair

         `O` - Owner

         `U` - Customer

         `I` - Insurance

         `W` - Warranty

         `S` - Special

         `D` - Depot

         `X` - Deleted

         `T` - Third Party

      enum:
      - O
      - U
      - I
      - W
      - S
      - D
      - X
      - T
    EstimateLineItemPhoto:
      required:
      - url
      type: object
      properties:
        url:
          type: string
          description: "a URL as defined by [RFC 3986](https://tools.ietf.org/html/rfc3986)\
            \ that is a photo for this line item."
          nullable: false
          example: https://www.example.com/photo.png
        status:
          description: "indicator of when this photo applies\n\n`REPAIRED` - Photo\
            \ is after repair \n\n`BEFORE` - Photo is before repair"
          nullable: true
          example: BEFORE
          allOf:
          - $ref: "#/components/schemas/EstimatePhotoStatus"
          - maxLength: 8
            type: object
          default: BEFORE
      description: Links to a photo for a single instance of damage for a shipping
        container.
    EstimatePhoto:
      required:
      - url
      type: object
      properties:
        url:
          type: string
          description: "a URL as defined by [RFC 3986](https://tools.ietf.org/html/rfc3986)\
            \ that is a photo for this estimate."
          nullable: false
          example: https://www.example.com/photo.png
        status:
          description: "indicator of when this photo applies\n\n`REPAIRED` - Photo\
            \ is after repair \n\n`BEFORE` - Photo is before repair"
          nullable: true
          example: BEFORE
          allOf:
          - $ref: "#/components/schemas/EstimatePhotoStatus"
          - maxLength: 8
            type: object
          default: BEFORE
      description: Links to a photo for a damage estimate.
    EstimatePhotoStatus:
      type: string
      description: "indicator of when this photo applies\n\n`REPAIRED` - Photo is\
        \ after repair \n\n`BEFORE` - Photo is before repair"
      example: BEFORE
      enum:
      - BEFORE
      - REPAIRED
      default: BEFORE
    EstimateTaxRate:
      required:
      - description
      - rate
      - rule
      type: object
      properties:
        description:
          maxLength: 255
          minLength: 1
          type: string
          description: "a unique, descriptive explanation for this tax rate"
          nullable: false
          example: PST Labor Tax Rate
        rule:
          description: |-
            which amount should taxes apply

            `B` - Both Labor Cost & Material Cost

            `L` - Labor Cost

            `M` - Material Cost

            _Note: Neither(N) is not an allowed value on this domain_
          example: B
          allOf:
          - $ref: "#/components/schemas/EstimateTaxRule"
        rate:
          minimum: 0.00
          type: number
          description: the tax rate as a percentage
          format: double
          nullable: false
          example: 19.5
      description: Represents a tax rate to be used on an estimate
    EstimateTaxRule:
      type: string
      description: |-
        which amount should taxes apply

        `B` - Both Labor Cost & Material Cost

        `N` - Neither

        `L` - Labor Cost

        `M` - Material Cost
      enum:
      - B
      - "N"
      - L
      - M
    EstimateType:
      type: string
      description: |-
        delineates the type of estimate; whether it was the initial, primary estimate or an ancillary / secondary repair after the initial decision

        `R` - Primary (Unknown Estimation Standard)

        `RI` - Primary (IICL)

        `RC` - Primary (CWCA)

        `RW` - Primary (UCIRC)

        `SC` - Secondary (CWCA)

        `SW` - Secondary (UCIRC)

        `SU` - Secondary Upgrade

        `AS` - Sell Upgrade

        `AU` - Ancillary Upgrade

        `AR` - Ancillary Repair
      enum:
      - R
      - RI
      - RC
      - RW
      - SC
      - SW
      - SU
      - AS
      - AU
      - AR
      default: R
    ExternalParty:
      type: object
      properties:
        companyId:
          maxLength: 9
          minLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          description: "a possible identifier for this party, often referred to as\
            \ an EDI Address"
          nullable: true
          example: DEHAMCMRA
        code:
          maxLength: 10
          minLength: 1
          type: string
          description: "a possible identifier for this party using the internal system\
            \ code for this company, will be system specific to the system delivering\
            \ or receiving this message"
          nullable: true
          example: HAMG
      description: represents a company (or location) involving shipping containers
        that may not have a companyId.  Either companyId or code is required to identify
        the party
      allOf:
      - $ref: "#/components/schemas/BaseParty"
    GateCreateRequest:
      required:
      - activityTime
      - adviceNumber
      - depot
      - status
      - type
      - unitNumber
      type: object
      properties:
        adviceNumber:
          maxLength: 16
          minLength: 1
