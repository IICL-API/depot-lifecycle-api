        transportType:
          description: How the shipping container was transported
          nullable: true
          example: TRUCK
          allOf:
          - $ref: "#/components/schemas/GateTransportType"
        photos:
          type: array
          description: An optional photo list of the shipping container at gate creation
          nullable: false
          items:
            $ref: "#/components/schemas/GatePhoto"
        trucker:
          description: the trucker delivering the shipping container
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ExternalParty"
        equipmentDetail:
          description: provides various equipment information related to the shipping
            container
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EquipmentDetail"
      description: data required to create a gate in or gate out record
    GatePhoto:
