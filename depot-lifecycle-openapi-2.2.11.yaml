      enum:
      - RAIL
      - TRUCK
      - BARGE
    GateUpdateRequest:
      type: object
      properties:
        status:
          description: |-
            a new indicator of the shipping container's status

            `A` - Non-damaged

            `D` - Damaged

            `S` - Sold
          nullable: true
          example: D
          allOf:
          - $ref: "#/components/schemas/GateRequestStatus"
        activityTime:
          type: string
          description: "the new date and time of the gate activity in local time;\
            \ i.e. `2019-04-10T19:37:04Z` \n\n( notation as defined by [RFC 3339,\
            \ section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )"
          format: date-time
          nullable: true
        type:
          description: |-
            gate type indicator

            `IN` - Gate In

            `OUT` - Gate Out
          nullable: true
          example: IN
          allOf:
          - $ref: "#/components/schemas/GateRequestType"
          - maxLength: 3
            type: object
        transportType:
          description: How the shipping container was transported
          nullable: true
          example: TRUCK
          allOf:
          - $ref: "#/components/schemas/GateTransportType"
        photos:
          type: array
          description: An optional photo list of the shipping container at gate update
          nullable: false
          items:
            $ref: "#/components/schemas/GatePhoto"
        trucker:
          description: the trucker delivering the shipping container
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ExternalParty"
      description: Data required to update a gate in or gate out record. Any data
        not provided will result in no update.
    GensetInfo:
      required:
      - mountType
      type: object
      properties:
        lastMaintenanceDate:
          type: string
          description: |-
            the last date that maintenance was performed

            ( full-date notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date
          nullable: true
          example: 2001-07-21
        lastMaintenanceHours:
          minimum: 0
          type: integer
          description: the number runtime hours at the last maintenance
          format: int32
          nullable: true
          example: 12
        currentMaintenanceHours:
          minimum: 0
          type: integer
          description: the number of hours since the last maintenance; often referred
            to as `Current Hours`
          format: int32
          nullable: true
          example: 1
        lastBeltChangeDate:
          type: string
          description: |-
            the last date that the belt was changed

            ( full-date notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date
          nullable: true
          example: 2001-07-21
        lastBeltChangeHours:
          minimum: 0
          type: integer
          description: the number runtime hours at the last belt change
          format: int32
          nullable: true
          example: 12
        totalHours:
          minimum: 0
          type: integer
          description: the total runtime hours
          format: int32
          nullable: true
          example: 24
        fuelLevel:
          maximum: 100
          minimum: 0
          type: integer
          description: the fuel level as a percentage
          format: int32
          nullable: true
          example: 100
        mountType:
          description: |-
            the mechanism that a genset mounts to a container.

            `CLIP` - Clip

            `UNDER` - Under slung
          example: CLIP
          allOf:
          - $ref: "#/components/schemas/MountType"
      description: Provides Genset specific information related to a shipping container
    InspectionReport:
      required:
      - mandateLevel
      - name
      type: object
      properties:
        name:
          maxLength: 16
          minLength: 1
          type: string
          description: a descriptive name to identify this inspection
          nullable: false
          example: FMCSA
        mandateLevel:
          description: |-
            how or by whom the inspection was mandated

            `NATIONAL` - National

            `REGIONAL` - Regional

            `INDUSTRY` - Industry
          example: NATIONAL
          allOf:
          - $ref: "#/components/schemas/MandateLevel"
        lastInspection:
          type: string
          description: |-
            the date this inspection was last performed

            ( full-date notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date
          nullable: true
          example: 2001-07-21
        validFor:
          minimum: 1
          type: integer
          description: the number of months this inspection is valid for
          format: int32
          nullable: true
          example: 12
        result:
          description: |-
            the result of the inspection

            `PASS` - Pass

            `FAIL` - Fail
          nullable: true
          example: PASS
          allOf:
          - $ref: "#/components/schemas/InspectionResult"
        inspector:
          description: the party performing this inspection
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ExternalParty"
        comments:
          type: array
          description: comments pertaining to this inspection
          nullable: false
          items:
            type: string
            example: An example inspection note.
      description: Holds key information and findings from an inspection
    InspectionResult:
      type: string
      description: |-
        the result of the inspection

        `PASS` - Pass

        `FAIL` - Fail
      example: PASS
      enum:
      - PASS
      - FAIL
    InsuranceCoverage:
      type: object
      properties:
        amountCovered:
          type: number
          description: the total amount allowable to by covered by insurance
          format: double
          nullable: true
        amountCurrency:
          maxLength: 3
          minLength: 3
          pattern: "^[A-Z]{3}$"
          type: string
          description: The currency for the insurance coverage amount
          nullable: true
          example: EUR
        appliesToCTL:
          type: boolean
          description: indicates if this coverage should apply to scenarios where
            the damage exceeds the depreciated value of the container
          nullable: true
        allOrNothing:
          type: boolean
          description: "indicates if the amount of damage exceeds the insurance coverage,\
            \ whether the lessee if fully responsible for the damage"
          nullable: true
        exceptions:
          type: array
          description: any contractual reason why the coverage may not apply
          nullable: false
          items:
            type: string
        exclusions:
          type: array
          description: reasons insurance coverage would be excluded from a repair
          nullable: false
          items:
            type: string
        exclusionItems:
          type: array
          description: "in lieu of a contractual description, this field can be used\
            \ to describe specifically what repairs are excluded"
          nullable: false
          items:
            $ref: "#/components/schemas/EstimateLineItemPart"
        inclusions:
          type: array
          description: reasons insurance coverage would include a repair
          nullable: false
          items:
            type: string
        inclusionItems:
          type: array
          description: "in lieu of a contractual description, this field can be used\
            \ to describe specifically what repairs are included"
          nullable: false
          items:
            $ref: "#/components/schemas/EstimateLineItemPart"
      description: describes the type of insurance coverage a given shipping container
        has for a damage repair
    InventorySnapshot:
      required:
      - depot
      - reportedBy
      - snapshotDateTime
      - units
      type: object
      properties:
        reportedBy:
          description: "the party whose system produced this view of the depot inventory;\
            \ since either the depot or the owner may implement this API, this identifies\
            \ whose view is being reported"
          allOf:
          - $ref: "#/components/schemas/Party"
        depot:
          description: the storage location this inventory list is for
          allOf:
          - $ref: "#/components/schemas/Party"
        snapshotDateTime:
          type: string
          description: |-
            the date and time in local time this inventory view was produced; compare unit statuses as of this moment, not the moment the response is read

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: false
        units:
          type: array
          description: the shipping containers currently at the depot for the calling
            party that match the search criteria; an empty array indicates no matching
            shipping containers are on site
          nullable: false
          items:
            $ref: "#/components/schemas/InventoryUnit"
      description: |-
        *This model is only proposed at this time and is in an alpha state - it is not production approved and may change without notice.*

        a point in time view of the shipping containers at a depot for the calling party, as seen by the responding system; used for near real time inventory status reconciliation between depot and owner systems
    InventoryStatus:
      type: string
      description: "Describes where the shipping container currently is in the depot\
        \ lifecycle.  This status intentionally only conveys lifecycle position; the\
        \ quality of the unit is reported separately as a grade and holds are reported\
        \ separately as a flag: \n\n`AWAITING_ESTIMATE` - gated in damaged and no\
        \ estimate has been submitted\n\n`AWAITING_CUSTOMER_APPROVAL` - an estimate\
        \ revision is awaiting customer approval\n\n`AWAITING_OWNER_DECISION` - the\
        \ estimate is awaiting the owner decision (work order)\n\n`REPAIR_AUTHORIZED`\
        \ - a work order authorizes repair and the repair is not yet complete\n\n\
        `AVAILABLE` - available for lease out\n\n`FOR_SALE` - designated for sale\n\
        \n`SOLD` - sold and awaiting removal\n\n`TIED_OUTBOUND` - allocated to an\
        \ outbound release / booking"
      example: AVAILABLE
      enum:
      - AWAITING_ESTIMATE
      - AWAITING_CUSTOMER_APPROVAL
      - AWAITING_OWNER_DECISION
      - REPAIR_AUTHORIZED
      - AVAILABLE
      - FOR_SALE
      - SOLD
      - TIED_OUTBOUND
    InventoryUnit:
      required:
      - status
      - statusDateTime
      - unitNumber
      type: object
      properties:
        unitNumber:
          maxLength: 11
          minLength: 1
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          description: the current unit number of the shipping container
          nullable: false
          example: CONU1234561
        equipment:
          maxLength: 10
          minLength: 1
          type: string
          description: the equipment type ISO code or an internal code if one does
            not exist for the given shipping container
          nullable: true
          example: 22G1
        status:
          description: "Describes where the shipping container currently is in the\
            \ depot lifecycle.  This status intentionally only conveys lifecycle position;\
            \ the quality of the unit is reported separately as a grade and holds\
            \ are reported separately as a flag: \n\n`AWAITING_ESTIMATE` - gated in\
            \ damaged and no estimate has been submitted\n\n`AWAITING_CUSTOMER_APPROVAL`\
            \ - an estimate revision is awaiting customer approval\n\n`AWAITING_OWNER_DECISION`\
            \ - the estimate is awaiting the owner decision (work order)\n\n`REPAIR_AUTHORIZED`\
            \ - a work order authorizes repair and the repair is not yet complete\n\
            \n`AVAILABLE` - available for lease out\n\n`FOR_SALE` - designated for\
            \ sale\n\n`SOLD` - sold and awaiting removal\n\n`TIED_OUTBOUND` - allocated\
            \ to an outbound release / booking"
          example: AVAILABLE
          allOf:
          - $ref: "#/components/schemas/InventoryStatus"
        statusDateTime:
          type: string
          description: |-
            the date and time in local time the shipping container entered the current status; used to buffer in-flight status transitions from reconciliation noise

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: false
        currentGrade:
          maxLength: 10
          minLength: 1
          type: string
          description: the grade / category the shipping container currently holds
          nullable: true
          example: IICL
        targetGrade:
          maxLength: 10
          minLength: 1
          type: string
          description: the grade / category the shipping container is expected to
            hold when work is complete - often used in lieu of an estimate inspection
            criteria.
          nullable: true
          example: IICL
        onHold:
          type: boolean
          description: indicates the shipping container is on hold; a hold is reported
            separately from the lifecycle status since a unit may be held at any lifecycle
            position
          nullable: true
          example: false
          default: false
        holdReason:
          maxLength: 255
          minLength: 1
          type: string
          description: "if the shipping container is on hold, an optional explanation\
            \ of the hold"
          nullable: true
          example: technical hold - pending bulletin TB1234
        damaged:
          type: boolean
          description: an indicator of whether the shipping container is currently
            considered damaged
          nullable: true
          example: false
        gateInDateTime:
          type: string
          description: |-
            the date and time in local time the shipping container gated in to the depot

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: true
        primaryRepairCompleteDateTime:
          type: string
          description: |-
            the date and time in local time the primary damage repair (see the primary estimate types of `EstimateType`) was completed, if it has been

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: true
        inCustomer:
          description: the customer that turned the shipping container in to the depot
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ExternalParty"
        redeliveryNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: the redelivery advice number the shipping container turned
            in against
          nullable: true
          example: AHAMG000000
        estimateNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: "if an estimate exists for the shipping container, the estimate\
            \ number"
          nullable: true
          example: DEHAMCE1856373
        estimateRevision:
          type: integer
          description: "if an estimate exists for the shipping container, the current\
            \ revision of that estimate"
          format: int32
          nullable: true
          example: 0
        workOrderNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: "if a work order authorizes activity for the shipping container,\
            \ the work order number"
          nullable: true
          example: WHAMG46019
        outCustomer:
          description: the customer the shipping container is allocated to lease out
            to
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ExternalParty"
        releaseNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: "if the shipping container is allocated outbound, the release\
            \ advice number authorizing it to leave the depot"
          nullable: true
          example: RHAMG000000
        comments:
          type: array
          description: comments pertaining to this unit for the intended recipient
            of this message
          nullable: false
          items:
            type: string
            example: An example unit level comment.
      description: |-
        *This model is only proposed at this time and is in an alpha state - it is not production approved and may change without notice.*

        the current status of a shipping container in a depot's inventory
    MachineryInfo:
      type: object
      properties:
        manufacturer:
          maxLength: 50
          minLength: 1
          type: string
          description: The cooling machinery manufacturer
          nullable: true
          example: Carrier Transicold
        modelName:
          maxLength: 50
          minLength: 1
          type: string
          description: The machinery model name
          nullable: true
          example: ThinLine
        modelNumber:
          maxLength: 50
          minLength: 1
          type: string
          description: The machinery model number
          nullable: true
          example: 69NT40-541-301
      description: details the cooling machinery attached to a shipping container
    MandateLevel:
      type: string
      description: |-
        how or by whom the inspection was mandated

        `NATIONAL` - National

        `REGIONAL` - Regional

        `INDUSTRY` - Industry
      example: INDUSTRY
      enum:
      - NATIONAL
      - REGIONAL
      - INDUSTRY
    MountType:
      type: string
      description: |-
        the mechanism that a genset attaches to a container.

        `CLIP` - Clip

        `UNDER` - Under slung
      example: CLIP
      enum:
      - CLIP
      - UNDER
    Party:
      required:
      - companyId
      type: object
      properties:
        companyId:
          maxLength: 9
          minLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          description: "the identifier for this party, often referred to as an EDI\
            \ Address"
          nullable: false
          example: DEHAMCMRA
        code:
          maxLength: 10
          minLength: 1
          type: string
          description: "the internal system code for this company, will be system\
            \ specific to the system delivering or receiving this message"
          nullable: true
          example: HAMG
      description: represents a company (or location) involving shipping containers
      allOf:
      - $ref: "#/components/schemas/ExternalParty"
      - $ref: "#/components/schemas/BaseParty"
    PendingResponse:
      type: object
      properties:
        code:
          maxLength: 6
          pattern: "^[A-Z0-9]{3}[0-9]{3}$"
          type: string
          description: indicator code for this response
          nullable: true
          example: EXX365
        message:
          type: string
          description: a descriptive reason why the activity was not immediately created
          nullable: true
          example: "Info EXX365 - Accepted, but requires verification to process."
      description: used inform why an activity could not be immediately processed
    PreliminaryDecision:
      required:
      - recommendation
      type: object
      properties:
        recommendation:
          maxLength: 11
          minLength: 1
          type: string
          description: "a speculative repair decision code to indicate if a box will\
            \ be repaired, sold, held for repair, could not determine a decision,\
            \ requires a survey before proceeding, etc"
          nullable: false
          example: SELL
        reason:
          maxLength: 255
          minLength: 1
          type: string
          description: "in the event a decision could not be determined, or a prerequisite\
            \ exists, a more descriptive message than the code provided by the `recommendation`\
            \ field"
          nullable: true
        difference:
          type: number
          description: A positive or negative amount showing how close the repair
            estimate was to a decision change
          format: double
          nullable: true
      description: an expected sell/fix decision to indicate the likely estimate owner
        approval action
    Redelivery:
      required:
      - approvalDate
      - depot
      - details
      - owner
      - quantity
      - recipient
      - redeliveryNumber
      - status
      type: object
      properties:
        redeliveryNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: "the identifier for this redelivery, also referred to as the\
            \ advice number or redelivery number"
          nullable: false
          example: AHAMG33141
        approvalDate:
          type: string
          description: |-
            the date and time in the depot local time zone (i.e. `2019-07-21T17:32:28Z`) that this redelivery is considered approved / effective

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: false
        expirationDate:
          type: string
          description: |-
            the date and time in the depot local time zone (i.e. `2020-07-21T17:32:28Z`) that this redelivery is considered no longer valid

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: true
        status:
          description: "Describes the status for this redelivery: \n\n`PENDING` -\
            \ redelivery is pending and not yet valid for turn in\n\n`APPROVED` -\
            \ redelivery is approved\n\n`COMPLETE` - all units are turned in and no\
            \ more may be turned in\n\n`EXPIRED` - the redelivery is now expired and\
            \ any remaining units are no longer valid for turn in\n\n`CANCELLED` -\
            \ the redelivery is cancelled and not valid for turn in"
          example: APPROVED
          allOf:
          - $ref: "#/components/schemas/RedeliveryStatus"
        estimateEmailRecipients:
          type: array
          description: list of emails to notify for an estimate revision
          nullable: false
          items:
            type: string
            example: customer@example.com
        comments:
          type: array
          description: comments pertaining to this unit for the intended recipient
            of this message
          nullable: false
          items:
            type: string
            example: An example redelivery level comment.
        depot:
          description: The location for this redelivery
          allOf:
          - $ref: "#/components/schemas/Party"
        owner:
          description: the shipping container's owner
          allOf:
          - $ref: "#/components/schemas/Party"
        recipient:
          description: The intended recipient for this message representing a redelivery
          allOf:
          - $ref: "#/components/schemas/ExternalParty"
        quantity:
          minimum: 0
          type: integer
          description: the number of shipping containers assigned to this redelivery.
          format: int32
          nullable: false
          example: 1
        details:
          minItems: 1
          type: array
          description: groups of like-criteria units
          nullable: false
          items:
            $ref: "#/components/schemas/RedeliveryDetail"
      description: An approval to deliver units to a storage location.
    RedeliveryDetail:
      required:
      - contract
      - customer
      - equipment
      - quantity
      type: object
      properties:
        customer:
          description: The customer for the contract on this detail.
          allOf:
          - $ref: "#/components/schemas/ExternalParty"
        contract:
          maxLength: 16
          minLength: 1
          type: string
          description: the contract code for the given shipping containers
          nullable: false
          example: CNCX05-100000
        equipment:
          maxLength: 10
          minLength: 1
          type: string
          description: the equipment type ISO code or an internal code if one does
            not exist for the given shipping containers
          nullable: false
          example: 22G1
        insuranceCoverage:
          description: the insurance coverage for damage repairs
          nullable: true
          allOf:
          - $ref: "#/components/schemas/InsuranceCoverage"
        grade:
          maxLength: 10
          minLength: 1
          type: string
          description: the grade / category of the unit as it was when it last left
            a depot
          nullable: true
          example: IICL
        upgradeType:
          description: |-
            the type of secondary upgrade this estimate represents.

            `FG` - Food grade

            `ML` - Malt

            `DB` - Dairy Board

            `EV` - Evian

            `WH` - Whiskey

            `SU` - Sugar

            `CF` - Coffee

            `TB` - Tobacco

            `MC` - Milk cartons

            `MP` - Milk powder

            `AM` - Ammunition

            `CH` - Cotton/Hay

            `TE` - Tea

            `FT` - Flexitank
          nullable: true
          example: AM
          allOf:
          - $ref: "#/components/schemas/UpgradeType"
        units:
          type: array
          description: "the specific units for this redelivery if defined, if not,\
            \ assumed blanket (any unit matching criteria can be tied up to the quantity\
            \ limit of this detail)"
          nullable: false
          items:
            $ref: "#/components/schemas/RedeliveryUnit"
        quantity:
          minimum: 0
          type: integer
          description: the number of shipping containers assigned to this detail
          format: int32
          nullable: false
          example: 1
        comments:
          type: array
          description: comments pertaining to this unit for the intended recipient
            of this message
          nullable: false
          items:
            type: string
            example: An example detail level comment.
      description: unit criteria that groups similar units on a redelivery
    RedeliveryStatus:
      type: string
      description: "Describes the status for this redelivery: \n\n`PENDING` - redelivery\
        \ is pending and not yet valid for turn in\n\n`APPROVED` - redelivery is approved\n\
        \n`COMPLETE` - all units are turned in and no more may be turned in\n\n`EXPIRED`\
        \ - the redelivery is now expired and any remaining units are no longer valid\
        \ for turn in\n\n`CANCELLED` - the redelivery is cancelled and not valid for\
        \ turn in"
      example: APPROVED
      enum:
      - PENDING
      - APPROVED
      - COMPLETE
      - EXPIRED
      - CANCELLED
    RedeliveryUnit:
      required:
      - billingParty
      - manufactureDate
      - status
      - unitNumber
      type: object
      properties:
        unitNumber:
          maxLength: 11
          minLength: 1
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          description: the current unit number of the shipping container
          nullable: false
          example: CONU1234561
        manufactureDate:
          type: string
          description: |-
            date and month this unit was manufactured

            ( full-date notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date
          nullable: false
          example: 2001-07-21
        lastOnHireDate:
          type: string
          description: |-
            the date this unit was on hired to the customer for this unit's detail

            ( full-date notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date
          nullable: true
          example: 2001-07-21
        lastOnHireLocation:
          description: The location this unit was last on-hired.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Party"
        status:
          description: "Describes the state of the shipping container for this redelivery:\
            \ \n\n`TIED` - shipping container is assigned to this redelivery and ready\
            \ to turn in.\n\n`REMOVED` - shipping container was attached to this redelivery,\
            \ but is no longer valid for redelivery.\n\n`TIN` - shipping container\
            \ has turned into the storage location of this redelivery."
          example: TIED
          allOf:
          - $ref: "#/components/schemas/RedeliveryUnitStatus"
        comments:
          type: array
          description: comments pertaining to this unit for the intended recipient
            of this message
          nullable: false
          items:
            type: string
            example: An example unit level comment.
        lastCargo:
          maxLength: 255
          minLength: 1
          type: string
          description: a description of the last cargo this shipping container carried
          nullable: true
          example: Aroset PS 5191
        lastCargoNumber:
          maxLength: 7
          minLength: 4
          pattern: "^([A-Z]{2})??\\s?[A-Z0-9]{4}$"
          type: string
          description: A number (such as a UN Number for hazardous materials) used
            to identify the type of cargo this container carried
          nullable: true
          example: UN 0305
        tankGrade:
          type: string
          description: "if this is a tank, then this describes the type of liquids\
            \ it can contain: \n\n`F` - Food\n\n`C` - Chemical "
          nullable: true
          example: C
          enum:
          - F
          - C
        technicalBulletins:
          type: array
          description: "list of technical bulletins associated to this unit - we suggest\
            \ this be fixed identifiers, codes, or urls"
          nullable: false
          items:
            type: string
            example: https://technical.example.com/bulletin/1234
        billingParty:
          description: The party that will handle any repair (estimate & work order)
            billing for units associated with this detail.
          allOf:
          - $ref: "#/components/schemas/Party"
        inspectionCriteria:
          maxLength: 10
          minLength: 1
          type: string
          description: "conveys the primary estimate instructions to the depot; if\
            \ the unit is damaged on turn in, the estimate standard that the shipping\
            \ container should be estimated to and if it should not be estimated,\
            \ then null.  When the owner needs more than one estimate for this unit,\
            \ this is the primary estimate and the additional estimates are conveyed\
            \ via `secondaryInspectionCriteria`."
          nullable: true
          example: IICL
        secondaryInspectionCriteria:
          type: array
          description: additional estimate instructions beyond the primary `inspectionCriteria`;
            each entry drives one more estimate the depot should produce for this
            unit (currently proposed as part of the multiple estimate workflow - not
            production approved).
          nullable: true
          items:
            $ref: "#/components/schemas/SecondaryInspectionCriteria"
        targetGrade:
          maxLength: 10
          minLength: 1
          type: string
          description: the grade / category to mark the unit when it arrives at the
            depot - often used in lieu of an estimate inspection criteria.
          nullable: true
          example: IICL
        machineryInfo:
          description: "if this detail is for a reefer shipping container, then this\
            \ details the cooling machinery information"
          nullable: true
          allOf:
          - $ref: "#/components/schemas/MachineryInfo"
        chassisInfo:
          description: "if this detail is for a Chassis, then this details specific\
            \ Chassis information"
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ChassisInfo"
        gensetInfo:
          description: "if this detail is for a Genset, then this details specific\
            \ Genset information"
          nullable: true
          allOf:
          - $ref: "#/components/schemas/GensetInfo"
      description: information for a specific unit on a redelivery
    RedeliveryUnitStatus:
      type: string
      description: "Describes the state of the shipping container for this redelivery:\
        \ \n\n`TIED` - shipping container is assigned to this redelivery and ready\
        \ to turn in.\n\n`REMOVED` - shipping container was attached to this redelivery,\
        \ but is no longer valid for redelivery.\n\n`TIN` - shipping container has\
        \ turned into the storage location of this redelivery."
      example: TIED
      enum:
      - TIED
      - REMOVED
      - TIN
    Release:
      required:
      - approvalDate
      - depot
      - details
      - expirationDate
      - owner
      - quantity
      - recipient
      - releaseNumber
      - status
      - type
      type: object
      properties:
        releaseNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: "the identifier for this release, also referred to as the advice\
            \ number or release number"
          nullable: false
          example: AHAMG33141
        status:
          description: "Describes the status for this release: \n\n`PENDING` - release\
            \ is pending and not yet valid\n\n`APPROVED` - release is approved for\
            \ leaving the storage location\n\n`COMPLETE` - all containers have left\
            \ the depot and no more may be processed\n\n`EXPIRED` - the release is\
            \ now expired and any remaining units are no longer valid\n\n`CANCELLED`\
            \ - the release is cancelled and not valid"
          example: APPROVED
          allOf:
          - $ref: "#/components/schemas/ReleaseStatus"
        type:
          description: "Describes the intended purpose of the release: \n\n`SALE`\
            \ - shipping containers are being sold\n\n`BOOK` - shipping containers\
            \ are being leased to a customer\n\n`REPO` - shipping containers are being\
            \ relocated by the owner to another storage location"
          allOf:
          - $ref: "#/components/schemas/ReleaseType"
        approvalDate:
          type: string
          description: |-
            the date and time in the depot local time zone (i.e. `2019-07-21T17:32:28Z`) that this release is considered approved / effective

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: false
        expirationDate:
          type: string
          description: |-
            the date and time in the depot local time zone (i.e. `2020-07-21T17:32:28Z`) that this release is considered no longer valid

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: false
        comments:
          type: array
          description: comments pertaining to this unit for the intended recipient
            of this message
          nullable: false
          items:
            type: string
            example: An example release level comment.
        depot:
          description: The location for this release
          allOf:
          - $ref: "#/components/schemas/Party"
        owner:
          description: The owner of the shipping container that approved the release
          allOf:
          - $ref: "#/components/schemas/Party"
        recipient:
          description: The intended recipient for this message representing a release
          allOf:
          - $ref: "#/components/schemas/ExternalParty"
        onHireSurveyRequired:
          type: boolean
          description: indicates if an on-hire survey is required for units associated
            to this release
        quantity:
          minimum: 0
          type: integer
          description: the number of shipping containers assigned to this release.
          format: int32
          example: 1
        details:
          minItems: 1
          type: array
          description: groups of like-criteria units
          nullable: false
          items:
            $ref: "#/components/schemas/ReleaseDetail"
      description: An approval to remove shipping containers from a storage location.
    ReleaseDetail:
      required:
      - contract
      - customer
      - equipment
      - grade
      - quantity
      type: object
      properties:
        customer:
          description: The customer for the contract on this detail.
          allOf:
          - $ref: "#/components/schemas/ExternalParty"
        contract:
          maxLength: 16
          minLength: 1
          type: string
          description: the contract code for the given shipping containers
          nullable: false
          example: CNCX05-100000
        equipment:
          maxLength: 10
          minLength: 1
          type: string
          description: the equipment type ISO code or an internal code if one does
            not exist for the given shipping containers
          nullable: false
          example: 22G1
        grade:
          maxLength: 10
          minLength: 1
          type: string
          description: the current grade of the unit
          nullable: false
          example: IICL
        upgradeType:
          description: |-
            the type of secondary upgrade this estimate represents.

            `FG` - Food grade

            `ML` - Malt

            `DB` - Dairy Board

            `EV` - Evian

            `WH` - Whiskey

            `SU` - Sugar

            `CF` - Coffee

            `TB` - Tobacco

            `MC` - Milk cartons

            `MP` - Milk powder

            `AM` - Ammunition

            `CH` - Cotton/Hay

            `TE` - Tea

            `FT` - Flexitank
          nullable: true
          example: AM
          allOf:
          - $ref: "#/components/schemas/UpgradeType"
        units:
          type: array
          description: "the specific units for this release if defined, if not, assumed\
            \ blanket (any unit matching criteria can be tied up to the quantity limit\
            \ of this detail)"
          nullable: false
          items:
            $ref: "#/components/schemas/ReleaseUnit"
        criteria:
          type: array
          description: 'additional criteria beyond the required properties of this
            detail to further restrict units.  i.e. <= 2003 manufacture year. '
          nullable: false
          items:
            $ref: "#/components/schemas/ReleaseDetailCriteria"
        comments:
          type: array
          description: comments pertaining to this unit for the intended recipient
            of this message
          nullable: false
          items:
            type: string
            example: An example detail level comment.
        quantity:
          minimum: 0
          type: integer
          description: the number of shipping containers assigned to this detail
          format: int32
          nullable: false
          example: 1
        preTripInspectionRequired:
          type: boolean
          description: indicator if mechanical equipment must be tested prior to lease
            out
          nullable: true
        desiredTemperature:
          type: integer
          description: the reefer setpoint / desired temperature in Celsius
          format: int32
          nullable: true
          example: -23
        desiredHumidity:
          type: integer
          description: the reefer desired humidity percentage
          format: int32
          nullable: true
          example: 65
        ventilation:
          maxLength: 10
          minLength: 1
          type: string
          description: "if the equipment has fresh air ventilation, the rate of the\
            \ fresh air ventilation"
          nullable: true
          example: 90 CBM
      description: groups similar units on a release
    ReleaseDetailCriteria:
      required:
      - fieldDescription
      - fieldId
      - fieldName
      - fieldValue
      type: object
      properties:
        fieldName:
          maxLength: 50
          minLength: 1
          type: string
          description: a legible field name
          nullable: false
          example: Minimum Tonnage
        fieldId:
          maxLength: 30
          minLength: 1
          type: string
          description: an abbreviated form of the field name
          nullable: false
          example: tonnageMin
        fieldDescription:
          maxLength: 255
          minLength: 1
          type: string
          description: an explanation of what the field value is
          nullable: false
          example: minimum tonnage rating of the unit (inclusive)
        fieldValue:
          maxLength: 500
          minLength: 1
          type: string
          description: the value of the field
          nullable: false
          example: "30"
      description: represents unit criteria to restrict units on a given detail
    ReleaseStatus:
      type: string
      description: "Describes the status for this release: \n\n`PENDING` - release\
        \ is pending and not yet valid\n\n`APPROVED` - release is approved for leaving\
        \ the storage location\n\n`COMPLETE` - all containers have left the depot\
        \ and no more may be processed\n\n`EXPIRED` - the release is now expired and\
        \ any remaining units are no longer valid\n\n`CANCELLED` - the release is\
        \ cancelled and not valid"
      example: APPROVED
      enum:
      - PENDING
      - APPROVED
      - COMPLETE
      - EXPIRED
      - CANCELLED
    ReleaseType:
      type: string
      description: "Describes the intended purpose of the release: \n\n`SALE` - shipping\
        \ containers are being sold\n\n`BOOK` - shipping containers are being leased\
        \ to a customer\n\n`REPO` - shipping containers are being relocated by the\
        \ owner to another storage location"
      enum:
      - SALE
      - BOOK
      - REPO
    ReleaseUnit:
      required:
      - status
      - unitNumber
      type: object
      properties:
        unitNumber:
          maxLength: 11
          minLength: 1
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          description: the current unit number of the shipping container
          nullable: false
          example: CONU1234561
        comments:
          type: array
          description: comments pertaining to this unit for the intended recipient
            of this message
          nullable: false
          items:
            type: string
            example: An example unit level comment.
        status:
          description: "Describes the state of the shipping container for this release:\
            \ \n\n`TIED` - shipping container is assigned to this release and ready\
            \ to lease out.\n\n`REMOVED` - shipping container was attached to this\
            \ release, but is no longer valid for release.\n\n`LOT` - shipping container\
            \ has left the storage location.\n\n`CANDIDATE` - this container is eligible\
            \ for this release but not currently assigned."
          example: TIED
          allOf:
          - $ref: "#/components/schemas/ReleaseUnitStatus"
        carbCompliant:
          type: boolean
          description: "specific to Genset equipment, indicator for California Air\
            \ Resources Board compliance"
          nullable: true
        manufactureDate:
          type: string
          description: |-
            date and month this unit was manufactured

            ( full-date notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date
          nullable: true
          example: 2001-07-21
      description: information for a specific unit on a release
    ReleaseUnitStatus:
      type: string
      description: "Describes the state of the shipping container for this release:\
        \ \n\n`TIED` - shipping container is assigned to this release and ready to\
        \ lease out.\n\n`REMOVED` - shipping container was attached to this release,\
        \ but is no longer valid for release.\n\n`LOT` - shipping container has left\
        \ the storage location.\n\n`CANDIDATE` - this container is eligible for this\
        \ release but not currently assigned."
      example: TIED
      enum:
      - REMOVED
      - TIED
      - LOT
      - CANDIDATE
    RepairComplete:
      required:
      - completionDate
      - depot
      - unitNumber
      - workOrderNumber
      type: object
      properties:
        workOrderNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: the identifier of the work order to repair complete
          nullable: false
          example: WHAMG46019
        depot:
          description: the storage location where the shipping container is being
            repaired
          allOf:
          - $ref: "#/components/schemas/Party"
        completionDate:
          type: string
          description: |-
            the date and time in the depot local time zone (i.e. `2018-04-10T19:37:04Z`) that this work order was repaired.

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: false
        unitNumber:
          maxLength: 11
          minLength: 10
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          description: the unit number of the shipping container at the time of repair
            approval
          nullable: false
          example: CONU1234561
      description: Necessary information to mark a specific unit under a work order
        repaired
    SecondaryInspectionCriteria:
      required:
      - inspectionCriteria
      type: object
      properties:
        inspectionCriteria:
          maxLength: 10
          minLength: 1
          type: string
          description: the estimate standard this additional estimate should be estimated
            to
          nullable: false
          example: SC
        upgradeType:
          description: |-
            the type of secondary upgrade this estimate transmission represents.

            `FG` - Food grade

            `ML` - Malt

            `DB` - Dairy Board

            `EV` - Evian

            `WH` - Whiskey

            `SU` - Sugar

            `CF` - Coffee

            `TB` - Tobacco

            `MC` - Milk cartons

            `MP` - Milk powder

            `AM` - Ammunition

            `CH` - Cotton/Hay

            `TE` - Tea

            `FT` - Flexitank
          nullable: true
          example: AM
          allOf:
          - $ref: "#/components/schemas/UpgradeType"
      description: "an additional estimate the depot should produce for this unit,\
        \ beyond the primary `inspectionCriteria`; the criteria dictates the estimate\
        \ type"
    TireTreadLocation:
      type: string
      description: |-
        the tire location of the tread depth measurement.

        `RFI` - Right Front Inner

         `RFO` - Right Front Outer

         `RRI` - Right Rear Inner

         `RRO` - Right Rear Outer

         `LFI` - Left Front Inner

         `LFO` - Left Front Outer

         `LRI` - Left Rear Inner

         `LRO` - Left Rear Outer
      example: RFI
      enum:
      - RFI
      - RFO
      - RRI
      - RRO
      - LFI
      - LFO
      - LRI
      - LRO
    TireTreadMeasurement:
      required:
      - depth
      - location
      - unitOfMeasure
      type: object
      properties:
        location:
          description: |-
            the tire location of the tread depth measurement.

            `RFI` - Right Front Inner

             `RFO` - Right Front Outer

             `RRI` - Right Rear Inner

             `RRO` - Right Rear Outer

             `LFI` - Left Front Inner

             `LFO` - Left Front Outer

             `LRI` - Left Rear Inner

             `LRO` - Left Rear Outer
          example: RFI
          allOf:
          - $ref: "#/components/schemas/TireTreadLocation"
        unitOfMeasure:
          description: |+
            the measurement type of the tread depth

            `CMT` - "Centimeters"

             `FOT` - "Feet"

             `GRM` - "Grams"

             `INH` - "Inches"

             `KGM` - "Kilograms"

             `MTR` - "Meters"

             `TON` - "Tons"

             `MTT` - "Metric Tons"

             `MMT` - "Millimeters"

          allOf:
          - $ref: "#/components/schemas/UnitOfMeasure"
        depth:
          minimum: 0.00
          type: number
          description: the measurement of the tire depth
          format: double
          nullable: false
          example: 9.95
      description: Provides a tire tread measurement in the indicated location
    UnitOfMeasure:
      type: string
      description: |+
        the measurement of the damage dimensions for this line item

        `CMT` - "Centimeters"

         `FOT` - "Feet"

         `GRM` - "Grams"

         `INH` - "Inches"

         `KGM` - "Kilograms"

         `MTR` - "Meters"

         `TON` - "Tons"

         `MTT` - "Metric Tons"

         `MMT` - "Millimeters"

      enum:
      - CMT
      - FOT
      - GRM
      - INH
      - KGM
      - MTR
      - TON
      - MTT
      - MMT
    UpgradeType:
      type: string
      description: |-
        an indicator for the upgrades applied to units on this detail.

        `FG` - Food grade

        `ML` - Malt

        `DB` - Dairy Board

        `EV` - Evian

        `WH` - Whiskey

        `SU` - Sugar

        `CF` - Coffee

        `TB` - Tobacco

        `MC` - Milk cartons

        `MP` - Milk powder

        `AM` - Ammunition

        `CH` - Cotton/Hay

        `TE` - Tea

        `FT` - Flexitank
      example: AM
      enum:
      - FG
      - ML
      - DB
      - EV
      - WH
      - SU
      - CF
      - TB
      - MC
      - MP
      - AM
      - CH
      - TE
      - FT
    WorkOrder:
      required:
      - approvalDate
      - depot
      - lineItems
      - owner
      - type
      - workOrderNumber
      type: object
      properties:
        relatedId:
          type: integer
          description: |-
            *Field is currently proposed to be added - not currently production approved.*

            An internal system identifier to be used to upload Estimate Photos or compare related activities.
          format: int64
          nullable: true
          example: 10102561
        workOrderNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: the identifier for this work order; this will be the approval
            number for repairs
          nullable: false
          example: WHAMG46019
        depot:
          description: the storage location where the shipping container is being
            repaired
          allOf:
          - $ref: "#/components/schemas/Party"
        owner:
          description: the owner of the shipping container
          allOf:
          - $ref: "#/components/schemas/Party"
        billingParty:
          description: the party that will bill the customer portion of damages for
            this repair
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Party"
        type:
          maxLength: 11
          minLength: 1
          type: string
          description: the type of repair approved
          nullable: false
          example: SELLCWCA
        approvalDate:
          type: string
          description: |-
            the date and time in the depot local time zone (i.e. `2017-05-10T19:37:04Z`) that this work order is authorized for repair

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: false
        approvalTotal:
          type: number
          description: the total amount approved for repair
          format: double
          nullable: true
          example: 175.00
        approvalCurrency:
          maxLength: 3
          minLength: 3
          pattern: "^[A-Z]{3}$"
          type: string
          description: the currency of the approval total
          nullable: true
          example: EUR
        expirationDate:
          type: string
          description: |-
            the date and time in the depot local time zone (i.e. `2020-07-21T17:32:28Z`) that this repair must be completed by

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: true
        comments:
          maxLength: 500
          minLength: 1
          type: string
          description: comments pertaining to this repair for the intended recipient
            of this message
          nullable: true
          example: CWCA repairs for unit TCKU3456654 total 175.00 EUR per DEHAMCE1856373.1
        lineItems:
          maxItems: 200
          minItems: 1
          type: array
          description: units associated to this work order
          nullable: false
          items:
            $ref: "#/components/schemas/WorkOrderUnit"
      description: An approval of a damage estimate signifying a depot may repair
        a shipping container
    WorkOrderUnit:
      required:
      - effectiveInspectionCriteria
      - status
      - unitNumber
      type: object
      properties:
        estimateNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: The estimate number that initiated this unit on this work order
          nullable: true
          example: DEHAMCE1856373
        unitNumber:
          maxLength: 11
          minLength: 10
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          description: the unit number of the shipping container at the time of repair
            approval
          nullable: false
          example: CONU1234561
        effectiveInspectionCriteria:
          maxLength: 10
          minLength: 1
          type: string
          description: repair the shipping container to this grade or category standard
          nullable: false
          example: CWCA-1
        remark:
          maxLength: 11
          minLength: 10
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          description: the unit number to remark the shipping container on repair
          nullable: true
        releaseNumber:
          maxLength: 16
          minLength: 1
          type: string
          description: the Release approved for gate out after repair
          nullable: true
        status:
          description: |-
            an indicator of the unit state on this work order

            `TIED` - shipping container is considered under repair on this work order

            `REMOVED` - shipping container is removed from this work order

            `REPAIRED` - shipping container is considered repaired
          example: TIED
          allOf:
          - $ref: "#/components/schemas/WorkOrderUnitStatus"
        approvals:
          type: array
          description: |-
            *Field is currently proposed to be added - not currently production approved.*

            when multiple estimates are approved for this unit, this represents a breakdown of approval amounts by specific estimate type (estimate type and upgrade type combinations). When empty or null, the unit uses the work order's single estimate context or does not have an estimate.
          nullable: false
          items:
            $ref: "#/components/schemas/WorkOrderUnitApproval"
      description: information for a specific unit on a work order
    WorkOrderUnitApproval:
      required:
      - allocationType
      - approvalTotal
      type: object
      properties:
        allocationType:
          description: the estimate type and optional upgrade type combination that
            this approval applies to
          allOf:
          - $ref: "#/components/schemas/EstimateAllocationType"
        approvalTotal:
          type: number
          description: the total amount approved for this specific estimate type
          format: double
          nullable: false
          example: 175.00
      description: |-
        *Type is currently proposed to be added - not currently production approved.*

        Represents the approval details for a specific estimate type on a work order unit. When multiple estimates are approved for a unit, each estimate type will have its own approval entry.
    WorkOrderUnitStatus:
      type: string
      description: |-
        an indicator of the unit state on this work order

        `TIED` - shipping container is considered under repair on this work order

        `REMOVED` - shipping container is removed from this work order

        `REPAIRED` - shipping container is considered repaired
      example: TIED
      enum:
      - TIED
      - REMOVED
      - REPAIRED
  securitySchemes:
    JWT_TOKEN:
      type: http
      description: JWT Bearer Authentication
      scheme: bearer
      bearerFormat: JWT
