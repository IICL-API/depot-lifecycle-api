paths:
  /api/v2/estimate:
    get:
      tags:
      - estimate
      summary: search for estimate(s)
      description: "Given search criteria, return estimates that match that criteria.\
        \  This interface is *limited* to a maximum of 10 estimates."
      operationId: indexEstimate
      parameters:
      - name: estimateNumber
        in: query
        description: the estimate number
        explode: false
        schema:
          maxLength: 16
          type: string
          nullable: true
          example: DEHAMCE1856373
      - name: unitNumber
        in: query
        description: the unit number of the shipping container at the time of estimate
          creation
        explode: false
        schema:
          maxLength: 11
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          nullable: true
          example: CONU1234561
      - name: depot
        in: query
        description: the identifier of the depot
        explode: false
        schema:
          maxLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          nullable: true
          example: DEHAMCMRA
      - name: lessee
        in: query
        description: the identifier of the lessee
        explode: false
        schema:
          maxLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          nullable: true
          example: SGSINONEA
      - name: revision
        in: query
        description: the revision number of the estimate
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
          example: 0
      - name: equipmentCode
        in: query
        description: the ISO equipment code of the shipping container
        explode: false
        schema:
          maxLength: 10
          type: string
          nullable: true
          example: 22G1
      responses:
        "200":
          description: successful found at least one estimate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Estimate"
        "400":
          description: invalid estimate search object was provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: searching for estimates is disallowed by security
        "404":
          description: no estimates were found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: reporting
    post:
      tags:
      - estimate
      summary: create an estimate revision
      description: Create a damage estimate or a revision to an existing estimate
        that documents the type of damage and the cost of the repairs.
      operationId: saveEstimate
      requestBody:
        description: Estimate object to create a new estimate revision
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Estimate"
        required: true
      responses:
        "200":
          description: successfully created and accepted the estimate revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateAllocation"
        "201":
          description: "successfully created the estimate revision, accepted it, and\
            \ created a repair authorization for the estimate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "202":
          description: "estimate accepted for processing, but not created due to manual\
            \ processing requirement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingResponse"
        "400":
          description: an invalid request was provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: creating an estimate is disallowed by security
        "404":
          description: the shipping container or depot could not be found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: activity
  /api/v2/estimate/{estimateNumber}:
    get:
      tags:
      - estimate
      summary: fetch an estimate revision
      description: "Finds an estimate by the given estimate number and depot, returning\
        \ the revision specified.  If revision is not specified, the current estimate\
        \ revision is returned."
      operationId: showEstimate
      parameters:
      - name: estimateNumber
        in: path
        description: the estimate number
        required: true
        schema:
          maxLength: 16
          type: string
          example: DEHAMCE1856373
      - name: depot
        in: query
        description: the identifier of the depot
        required: true
        explode: false
        schema:
          maxLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          example: DEHAMCMRA
      - name: revision
        in: query
        description: the revision number to show for the estimate; when not specified
          the current revision will be returned.
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
          example: 0
      responses:
        "200":
          description: successfully found the estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "400":
          description: invalid request was supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: fetching estimate is disallowed by security
        "404":
          description: estimate not found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: reporting
    put:
      tags:
      - estimate
      summary: customer approve an estimate
      description: "Instead of sending in a full estimate revision, this endpoint\
        \ can be used to approve an estimate without revising it.  This endpoint would\
        \ typically be implemented by a lessee.  A depot would use the send revision\
        \ to report approvals."
      operationId: customerApproveEstimate
      parameters:
      - name: estimateNumber
        in: path
        description: the estimate number
        required: true
        schema:
          maxLength: 16
          type: string
          example: DEHAMCE1856373
      - name: depot
        in: query
        description: the identifier of the depot
        required: true
        explode: false
        schema:
          maxLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          example: DEHAMCMRA
      requestBody:
        description: customer approval object to update an existing estimate
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateCustomerApproval"
        required: true
      responses:
        "200":
          description: successfully approved the estimate revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateAllocation"
        "201":
          description: successfully received the customer approval and issued a repair
            authorization for the estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "202":
          description: "customer approval accepted for processing, but not created\
            \ due to manual processing requirement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingResponse"
        "400":
          description: an error occurred trying to customer approve the estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: customer approval is disallowed by security
        "404":
          description: the estimate or depot was not found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: activity
    delete:
      tags:
      - estimate
      summary: cancels an estimate
      description: Cancels an estimate (deletes it and all revisions from the system)
      operationId: deleteEstimate
      parameters:
      - name: estimateNumber
        in: path
        description: the estimate number
        required: true
        schema:
          maxLength: 16
          type: string
          example: DEHAMCE1856373
      - name: depot
        in: query
        description: the identifier of the depot
        required: true
        explode: false
        schema:
          maxLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          example: DEHAMCMRA
      responses:
        "200":
          description: successfully cancelled the estimate
        "400":
          description: an error occurred trying to cancel the estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: cancel estimate is disallowed by security
        "404":
          description: the estimate or depot was not found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: activity
    patch:
      tags:
      - estimate
      summary: update estimate totals
      description: "When the creation of the estimate is delayed due to a 202, after\
        \ the manual processing is complete, this method is called to perform the\
        \ update of the totals.  It is often implemented by a depot so that the lessor\
        \ can report updates."
      operationId: updateTotals
      parameters:
      - name: estimateNumber
        in: path
        description: the estimate number
        required: true
        schema:
          maxLength: 16
          type: string
          example: DEHAMCE1856373
      requestBody:
        description: total breakdowns to finish creating an estimate
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateAllocation"
        required: true
      responses:
        "200":
          description: successfully received estimate totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "400":
          description: an error occurred trying to update totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: estimate total update is disallowed by security
        "404":
          description: the estimate was not found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: activity
  /api/v2/estimatePhoto/{relatedId}:
    post:
      tags:
      - estimate photos
      summary: upload an estimate photo
      description: "Instead of using a link, upload a photo for a previously allocated\
        \ estimate"
      operationId: uploadEstimatePhoto
      parameters:
      - name: relatedId
        in: path
        description: the related identifier (from the estimate allocation) that this
          photo should be attached
        required: true
        schema:
          type: integer
          format: int64
          example: 10102561
      - name: line
        in: query
        description: an optional line number to associate this photo to
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
          example: 1
      - name: status
        in: query
        description: "indicator of when this photo applies\n\n`REPAIRED` - Photo is\
          \ after repair \n\n`BEFORE` - Photo is before repair"
        explode: false
        schema:
          maxLength: 8
          type: string
          nullable: true
          example: BEFORE
          enum:
          - REPAIRED
          - BEFORE
          default: BEFORE
      requestBody:
        description: The photo to upload (expected name of part is `file`)
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: successfully uploaded an estimate photo
        "202":
          description: "photo accepted for processing, but not created due to manual\
            \ processing requirement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingResponse"
        "400":
          description: an invalid request was provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: uploading an estimate photo is disallowed by security
        "404":
          description: the estimate or line item could not be found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: activity
  /api/v2/gate:
    post:
      tags:
      - gate
      summary: create a gate record
      description: Creates either a gate-in or gate-out record for the given shipping
        container against the provided advice and depot data.
      operationId: saveGate
      requestBody:
        description: gate object to create a new gate in or gate out record
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateCreateRequest"
        required: true
      responses:
        "200":
          description: successfully created a gate in or gate out record for the shipping
            container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateResponse"
        "202":
          description: "gate accepted for processing, but not created due to manual\
            \ processing requirement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingResponse"
        "400":
          description: an error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: create a gate record is disallowed by security configuration
        "404":
          description: the shipping container or depot could not be found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: activity
  /api/v2/gate/{depot}/{adviceNumber}/{unitNumber}:
    put:
      tags:
      - gate
      summary: update a gate record
      description: Correct the initial damage indicator status or activity time from
        when the gate record was created.  Some depot operators refer to this as a
        `status` update.
      operationId: updateGate
      parameters:
      - name: adviceNumber
        in: path
        description: the redelivery or release advice number for the gate record
        required: true
        schema:
          maxLength: 16
          minLength: 1
          type: string
          example: AHAMG000000
      - name: unitNumber
        in: path
        description: the current unit number of the shipping container
        required: true
        schema:
          maxLength: 11
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          example: CONU1234561
      - name: depot
        in: path
        description: the identifier of the depot
        required: true
        schema:
          maxLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          example: DEHAMCMRA
      requestBody:
        description: gate object to update an existing record
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateUpdateRequest"
        required: true
      responses:
        "200":
          description: successfully update the gate record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateResponse"
        "202":
          description: "gate update accepted for processing, but not created due to\
            \ manual processing requirement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingResponse"
        "400":
          description: an error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: update a gate record is disallowed by security
        "404":
          description: the shipping container or depot could not be found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: activity
    delete:
      tags:
      - gate
      summary: delete a gate record
      description: Delete a gate record.
      operationId: deleteGate
      parameters:
      - name: adviceNumber
        in: path
        description: the redelivery or release advice number to identify which gate
          record to delete
        required: true
        schema:
          maxLength: 16
          minLength: 1
          type: string
          example: AHAMG000000
      - name: unitNumber
        in: path
        description: the current unit number of the shipping container
        required: true
        schema:
          maxLength: 11
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          example: CONU1234561
      - name: depot
        in: path
        description: the identifier of the depot
        required: true
        schema:
          maxLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          example: DEHAMCMRA
      responses:
        "200":
          description: successfully delete the gate record
        "400":
          description: an error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: delete a gate record is disallowed by security
        "404":
          description: the shipping container or depot could not be found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: activity
  /api/v2/gate/{unitNumber}:
    get:
      tags:
      - gate
      summary: fetch the current gate status
      description: "For the given unit number, if the shipping container is currently\
        \ gated in or gated out, fetch the current interchange information - status,\
        \ the time of the gate, etc.  This is a reporting only function.  To correct\
        \ a gate status, use the update a gate record endpoint."
      operationId: showGate
      parameters:
      - name: unitNumber
        in: path
        description: the current unit number of the shipping container
        required: true
        schema:
          maxLength: 11
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          example: CONU1234561
      responses:
        "200":
          description: successfully found current gate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateStatus"
        "400":
          description: an error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: fetching a gate record is disallowed by security
        "404":
          description: the shipping container was not found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: reporting
  /api/v2/gatePhoto/{relatedId}:
    post:
      tags:
      - gate photos
      summary: upload a gate photo
      description: "Instead of using a link, upload a photo for a previously created\
        \ gate record"
      operationId: uploadGatePhoto
      parameters:
      - name: relatedId
        in: path
        description: the related identifier (from the gate record) that this photo
          should be attached
        required: true
        schema:
          type: integer
          format: int64
          example: 10102561
      requestBody:
        description: The photo to upload (expected name of part is `file`)
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: successfully uploaded a gate photo
        "202":
          description: "photo accepted for processing, but not created due to manual\
            \ processing requirement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingResponse"
        "400":
          description: an invalid request was provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: uploading a gate photo is disallowed by security
        "404":
          description: the gate record could not be found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: activity
  /api/v2/inventory/{depot}:
    get:
      tags:
      - inventory
      summary: fetch current inventory for a depot
      description: |-
        *This API is only proposed at this time and is in an alpha state - it is not production approved and may change without notice.*

        Lists the shipping containers currently on site at the given depot for the calling party, with the responding system's current lifecycle status for each.  This is a reporting only snapshot intended for near real time inventory status reconciliation; it does not replace gate records.  Either the depot or the owner may implement this API - the response reports that system's view of the depot's inventory and the caller compares it against its own.
      operationId: indexInventory
      parameters:
      - name: depot
        in: path
        description: the identifier of the depot
        required: true
        schema:
          maxLength: 9
          pattern: "^[A-Z0-9]{9}$"
          type: string
          example: DEHAMCMRA
      - name: unitNumber
        in: query
        description: the unit number of the shipping container to filter to
        explode: false
        schema:
          maxLength: 11
          pattern: "^[A-Z]{4}[X0-9]{6}[A-Z0-9]{0,1}$"
          type: string
          nullable: true
          example: CONU1234561
      - name: status
        in: query
        description: the inventory status to filter to
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/InventoryStatus"
      - name: statusChangedAfter
        in: query
        description: |-
          only include shipping containers whose status changed after this date and time; used for cheap delta pulls between full snapshots

          ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
        explode: false
        schema:
          type: string
          format: date-time
          nullable: true
      responses:
        "200":
          description: successfully fetched the depot inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySnapshot"
        "400":
          description: an error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: fetching depot inventory is disallowed by security
        "404":
          description: the depot could not be found
        "501":
          description: this feature is not supported by this server
        "503":
          description: "API is temporarily paused, and not accepting any activity"
      security:
      - JWT_TOKEN: []
      x-iicl-purpose: reporting
  /api/v2/redelivery:
    get:
      tags:
