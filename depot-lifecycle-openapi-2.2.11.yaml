    GateStatus:
      required:
      - activityTime
      - adviceNumber
      - depot
      - status
      type: object
      properties:
        relatedId:
          type: integer
          description: |-
            *Field is currently proposed to be added - not currently production approved.*

            An internal system identifier to be used to upload Gate Photos or compare related activities.
          format: int64
          nullable: true
          example: 10102561
        adviceNumber:
          maxLength: 16
          type: string
          description: the redelivery or release advice number for the gate record
          nullable: false
          example: AHAMG000000
        depot:
          description: the storage location for the given advice number
          allOf:
          - $ref: "#/components/schemas/Party"
        status:
          maxLength: 1
          type: string
          description: |-
            the current status

            `A` - Non-damaged

            `D` - Damaged

            `S` - Sold
          nullable: false
          example: D
          enum:
          - A
          - D
          - S
        activityTime:
          type: string
          description: |-
            the date and time of the gate activity in local time

            ( notation as defined by [RFC 3339, section 5.6](https://tools.ietf.org/html/rfc3339#section-5.6) )
          format: date-time
          nullable: false
        insuranceCoverage:
          description: The applicable insurance coverage for damage estimate purposes
          nullable: true
          allOf:
          - $ref: "#/components/schemas/InsuranceCoverage"
        currentExchangeRate:
          type: number
          description: the exchange rate to convert billed currency to the local currency
            for damage estimate totals
          format: double
          nullable: true
          example: 0.8133
        currentInspectionCriteria:
          maxLength: 10
          type: string
          description: "the unit should be inspected to this grade; if none, no estimate\
            \ is allowed"
          nullable: true
          example: IICL
        type:
          maxLength: 3
          type: string
          description: |-
            current gate type indicator

            `IN` - Gate In

            `OUT` - Gate Out

