depotlifecycle:
  client:
    url: "${LIFECYCLE_ENDPOINT:`http://localhost:8086/`}"
    authorization: "${LIFECYCLE_AUTHORIZATION:`Basic bm92YWxpZGF0ZTpub3ZhbGlkYXRl`}" # no validate defaults
  documentation:
    application:
      description: |
        # Purpose

         A depot centric API for managing the interchange activity & repair lifecycle of a shipping container.  The API is expected to be used by Customers, Depots, and Owners to facilitate real time communication between systems instead of traditional EDI files.


         # Overview

         The depot lifecycle API is a RESTful API.  It's requests & responses are loosely based upon traditional EDI files.  For code definitions, explanations, or traditional EDI definitions refer to [IICL TB 002, February 2003](https://www.iicl.org/iiclforms/assets/File/public/bulletins/TB002_EDIS_February_2003.pdf).


         # JSON

         The requests and responses of this API are formatted according to the [JSON](https://www.json.org/) standard.

         ## Null vs Absent

         For all types other than arrays, nullable and absent are equivalent by this specification.  For example, if a non-array attribute is marked optional it may be excluded from the JSON or it may be explicitly set to null.  However, to keep request sizes small, it is recommended to prefer excluding attributes rather than sending an explicit null.

         For arrays, null should be avoided.  For example, if the array is empty or there are no values expected for the array then either the field can be excluded from the JSON or an empty array should be transmitted.

         ## Blank Values

         Blank values should generally be avoided. Send a `null` value instead of blank. The API documentation represents blank as not allowed by setting the minimum length to 1 and allowing the field to be null. 
         ## Default Values

         Anywhere a default value is defined in this API, if null is transmitted, it is assumed the default value will be used.

         ## Forward Compatibility

         To maintain compatibility with future versions of this specification, it is recommended to never fail on unknown properties in requests or responses.


         # Reference

         This API is documented by the [OpenAPI](https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md) specification.  This page was initially created by the [Swagger-Editor](https://github.com/swagger-api/swagger-editor) tool and later autogenerated via the [sample java application](https://github.com/IICL-API/depot-lifecycle-api/tree/main/samples/java) in the GitHub repository.  The *yaml* specification file can be found [here](depot-lifecycle-openapi.yaml).


         # Implementation Expectations

         Not all parties are required or expected to implement every feature. Any feature not implemented should return a http status code of `501`.


         # APIs to Implement

         While anyone is free to implement all or a selected set of the APIs listed here, the typical use case would be for Depot to Lessor communication.  For the Depot, they would call the Lessor's system using the following APIs:

         1. POST - create a gate record 

         2. PUT - update a gate record 

         3. POST - create an estimate revision 

         4. PUT - marks a shipping container repaired 

         These APIs allow the Depot to report the initial gate in movement, issue gate data corrections (i.e. the damage status or activity date), participate in the estimate process (i.e. creation, surveys, and customer approval), notify when a shipping container is repaired, and create a gate out for leaving the depot.


         # Lifecycle Process Flows

         The following flows illustrate how the individual APIs combine to model the life of a shipping container inside a depot.  These are the common, suggested workflows - the exact sequence, parties involved, and which steps apply may vary by implementation and business relationship (see also `Implementation Expectations`).  JSON examples are abridged to the fields relevant to each step; refer to the schema definitions for complete payloads.

         A key concept throughout: a **work order is an authorization for the depot to take action** on a shipping container - it is broader than "repair this unit".  Depots typically organize their yards into stacks (some possible examples include `to-estimate` stack, `to-fix` stack, `sell` stack, etc.) and a work order authorizes the move/action; the specifics vary by depot and are intentionally not modeled by this API.

         ## Standard Damage Repair Cycle

         The typical flow for a damaged shipping container turned in to a depot:

         1. **Redelivery** (Owner -> Depot / Customer) - before a shipping container may arrive, the owner authorizes the customer to turn it in to the depot: `POST /v2/redelivery`.  Redeliveries are always initiated by the owner and may be transmitted to both the customer and the depot.  The redelivery advice is the depot's authority to accept the unit at the gate, and it communicates up front whether an estimate is allowed via the inspection criteria on the `RedeliveryUnit` (the estimation instructions).

         2. **Gate In** (Depot -> Owner) - the depot reports the arrival: `POST /v2/gate` with `type` = `IN`, `status` = `D` (damaged), and the redelivery advice number.  When the unit is damaged an estimate is expected to be performed; the presence of inspection criteria (echoed back as `currentInspectionCriteria` on the `GateResponse`) is the indicator to the depot that estimation is allowed and to what grade.  The response also carries the applicable `insuranceCoverage` and `currentExchangeRate`.

         3. **Initial estimate (revision 0)** (Depot -> Owner) - the depot surveys the damage and submits `POST /v2/estimate` with `condition` = `D`, `revision` = `0`, and the damage `lineItems`.  The response is an `EstimateAllocation`: the owner / customer / insurance split of the total, plus an optional `preliminaryDecision` indicating the likely repair-or-sell outcome.

         4. **Revisions** (Depot -> Owner, or Owner -> Depot for surveys) - surveys and corrections produce further transmissions of the same `estimateNumber` with an incremented `revision` and an updated `condition` (`E` - customer surveyed, `L` - owner surveyed).  Each revision fully replaces the prior one.  When customer approval is required, the owner notifies the customer (Owner -> Customer) of each revision until the approval has been given.

         5. **Customer approval** (Customer -> Owner, then Owner -> Depot) - when customer approval is required, the customer transmits the approval of their portion to the owner via `PUT /v2/estimate/{estimateNumber}` (an `EstimateCustomerApproval`); the owner then notifies the depot by sending an estimate revision with the `customerApproval` embedded and `condition` = `F` (approved, no survey) or `G` (approved, surveyed).  A depot that obtains the approval directly reports it to the owner the same way (Depot -> Owner revision).  In some relationships customer approval is implicit and the first revision is considered approved automatically.

         6. **Owner approval = work order** (Owner -> Depot) - there is no "owner approved" estimate state; the owner's decision *is* the work order, and it always applies to the latest revision of the referenced estimate.  It arrives either as a `201` response to the estimate create/approve call or as a separate `POST /v2/workOrder` naming the estimate:

            ```
            {
              "workOrderNumber": "WHAMG46019",
              "type": "CWCA",
              "approvalTotal": 175.00,
              "lineItems": [ { "unitNumber": "CONU1234561", "estimateNumber": "DEHAMCE1856373", "status": "TIED", "effectiveInspectionCriteria": "CWCA-1" } ]
            }
            ```

         7. **Repair complete** (Depot -> Owner) - when the depot finishes the repair it reports `PUT /v2/workOrderUnit/{workOrderNumber}` (a `RepairComplete`) and the unit becomes available.

         8. **Release** (Owner -> Depot) - when the shipping container is leased out again, the owner issues the advice that approves it to leave the depot: `POST /v2/release`.  The release advice number authorizes the gate out.

         9. **Gate Out** (Depot -> Owner) - the shipping container leaves the depot: `POST /v2/gate` with `type` = `OUT`, `status` = `A`, and the release advice number.

         ## Variations

         **Undamaged turn in** - a unit gated in with `status` = `A` needs no estimate; the flow is simply gate in, then eventually gate out.

         **Direct work order (no estimate)** (Owner -> Depot) - a work order may be issued without any estimate, for example an ancillary upgrade to an undamaged container.  The `WorkOrderUnit` simply omits `estimateNumber`, and a work order not initiated by an estimate may cover multiple units.  The repair complete and gate out steps are unchanged.

         **Sell authorization** (Owner -> Depot) - note that work order `type` codes are **not standardized** by this API; they vary by implementation and are agreed between trading partners.  A common convention is a `SELL` type: a zero-amount work order indicating the container will be sold rather than repaired.  A sell authorization is considered completed automatically - a repair complete message is never sent for it.

         ## Multiple Estimates in a Single Transmission

         *This process is currently a proposal - it is not production approved and the fields it relies upon are individually marked as proposed in the schema definitions.*

         Sometimes an owner needs several what-if estimates for the same shipping container - typically to decide whether, while repairing it, the container should also be upgraded (e.g. a plain CWCA repair versus repair plus food grade upgrade).  Estimate writer time is expensive, so the additional scenarios are written up together with the primary repair as a set rather than as separate estimates - the proposal transmits that set in a single estimate:

         - The owner requests multiple estimates via the redelivery advice (Owner -> Depot) - the `RedeliveryUnit` encodes the expected primary estimate type via the `inspectionCriteria` field and any additional required types via the `secondaryInspectionCriteria` array field.
         - One `Estimate` is sent (Depot -> Owner) with a single `estimateNumber` and a combined `total`.
         - **The estimates are cumulative** - the primary repair (e.g. `RC`) contains the repair line items; each additional estimate type (e.g. an `AU` ancillary food grade upgrade) contains only its *additive* line items on top of the primary repair.  Because the set is cumulative it shares one `condition` and one `revision`, and a cancellation cancels every estimate type in the transmission.
         - Each line item is tagged with the estimate type(s) it belongs to via `allocationTypes` (a combination of estimate `type` and optional `upgradeType`).  A line item shared by several additional estimate types carries multiple tags; a line item with no tags belongs to the estimate's own `type` / `upgradeType`.
         - The combined allocation is returned with a per-type breakdown in `allocationsByType`; each entry identifies its estimate via `allocationType` and carries the additive totals for that type.

            ```
            {
              "estimateNumber": "DEHAMCE1856373",
              "type": "RC",
              "total": 800.00,
              "lineItems": [
                { "...": "damage repair (primary repair)", "allocationTypes": [ { "type": "RC" } ] },
                { "...": "additive food grade upgrade work", "allocationTypes": [ { "type": "AU", "upgradeType": "FG" } ] }
              ]
            }
            ```

         - **Customer approval is unchanged** - the customer always approves the primary repair type only (their damage responsibility); the additional estimate types are owner concerns.
         - **The owner selects via the work order** (Owner -> Depot) - because the estimates are cumulative, the `WorkOrderUnit` lists an approval in `approvals` (`allocationType` + `approvalTotal`) for *every* estimate type being performed.  For example, performing the food grade upgrade means both the primary `RC` approval and the additive `AU` / `FG` approval appear.  As always, the work order applies to the latest revision of the estimate.  Estimate types *not* included on the work order are implicitly declined; no separate cancellation is sent.

            ```
            {
              "workOrderNumber": "WHAMG46019",
              "type": "AU",
              "approvalTotal": 800.00,
              "lineItems": [ {
                "unitNumber": "CONU1234561",
                "estimateNumber": "DEHAMCE1856373",
                "status": "TIED",
                "effectiveInspectionCriteria": "CWCA-1",
                "approvals": [
                  { "allocationType": { "type": "RC" }, "approvalTotal": 500.00 },
                  { "allocationType": { "type": "AU", "upgradeType": "FG" }, "approvalTotal": 300.00 }
                ]
              } ]
            }
            ```

         - Repair complete and gate out then proceed exactly as in the standard cycle.


         # Depot Identifiers

         Depot or facility identifiers, henceforth referred to as `EDI Address`, `CompanyId`, or `Party Id` in this document, are maintained by The Bureau International des Containers (BIC) and officially known as the BIC Facility Code. For codes and more information please refer to [https://www.bic-code.org/bic-facility-codes](https://www.bic-code.org/bic-facility-codes/).


         # Deprecation

         If this API version were to be discontinued, a minimum of 6 months time would pass before it's removal.


         # Change Log Types

         * api - a backend api change that will require development to support
         * doc - a documentation only change, no implementation impact
         * server - a change (or implementation) to the example server implementation
         * client - a change (or implementation) to the example client implementation


